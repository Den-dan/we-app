<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0f0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мы">

  <title>Мы 💑</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Стили -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="app" id="app">

  <!-- Экран загрузки -->
  <div id="loader" style="
    position:fixed; inset:0;
    background:var(--bg-primary);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; z-index:999;
  ">
    <div style="font-size:48px;">💑</div>
    <div style="color:var(--text-muted); font-size:14px; font-family:var(--font);">загрузка...</div>
  </div>

  <!-- Экран авторизации -->
  <div id="auth-screen" style="display:none;">
    <div style="padding:48px 24px; min-height:100vh; display:flex; flex-direction:column; justify-content:center;">
      <div style="text-align:center; margin-bottom:48px;">
        <div style="font-size:64px; margin-bottom:16px;">💑</div>
        <h1 style="font-size:32px; font-weight:700; margin-bottom:8px;">Мы</h1>
        <p style="color:var(--text-muted);">пространство для двоих</p>
      </div>

      <!-- Вход -->
      <div id="login-form">
        <p class="section-title" style="text-align:center; margin-bottom:20px;">Войти</p>
        <input class="input" id="login-email" type="email" placeholder="Email" style="margin-bottom:12px;">
        <input class="input" id="login-password" type="password" placeholder="Пароль" style="margin-bottom:20px;">
        <button class="btn btn-primary btn-full" onclick="login()">Войти</button>
        <div class="divider"></div>
        <button class="btn btn-secondary btn-full" onclick="showRegister()">Создать аккаунт</button>
      </div>

      <!-- Регистрация -->
      <div id="register-form" style="display:none;">
        <p class="section-title" style="text-align:center; margin-bottom:20px;">Регистрация</p>
        <input class="input" id="reg-name" type="text" placeholder="Твоё имя" style="margin-bottom:12px;">
        <input class="input" id="reg-email" type="email" placeholder="Email" style="margin-bottom:12px;">
        <input class="input" id="reg-password" type="password" placeholder="Пароль" style="margin-bottom:20px;">
        <button class="btn btn-primary btn-full" onclick="register()">Создать аккаунт</button>
        <div class="divider"></div>
        <button class="btn btn-secondary btn-full" onclick="showLogin()">Уже есть аккаунт</button>
      </div>

      <p id="auth-error" style="color:var(--danger); text-align:center; margin-top:16px; font-size:14px; display:none;"></p>
    </div>
  </div>

  <!-- Экран создания/подключения пары -->
  <div id="couple-screen" style="display:none;">
    <div style="padding:48px 24px; min-height:100vh; display:flex; flex-direction:column; justify-content:center;">
      <div style="text-align:center; margin-bottom:48px;">
        <div style="font-size:64px; margin-bottom:16px;">🔗</div>
        <h2 style="font-size:24px; font-weight:700; margin-bottom:8px;">Создай пару</h2>
        <p style="color:var(--text-muted);">Создай пространство и пригласи партнёра</p>
      </div>

      <button class="btn btn-primary btn-full" onclick="createCouple()" style="margin-bottom:12px;">
        Создать пару
      </button>

      <div class="divider"></div>

      <p class="section-title" style="text-align:center; margin-bottom:12px;">Или введи код приглашения</p>
      <input class="input" id="invite-code-input" type="text" placeholder="Код приглашения" style="margin-bottom:12px; text-align:center; letter-spacing:4px; font-size:18px;">
      <button class="btn btn-secondary btn-full" onclick="joinCouple()">Присоединиться</button>

      <p id="couple-error" style="color:var(--danger); text-align:center; margin-top:16px; font-size:14px; display:none;"></p>
    </div>
  </div>

  <!-- Основное приложение -->
  <div id="main-app" style="display:none;">

    <!-- Страницы -->
    <div id="page-dashboard" class="page active"></div>
    <div id="page-planner" class="page"></div>
    <div id="page-mood" class="page"></div>
    <div id="page-intimate" class="page"></div>
    <div id="page-more" class="page"></div>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="navigateTo('dashboard', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        Главная
      </button>
      <button class="nav-item" onclick="navigateTo('planner', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Планы
      </button>
      <button class="nav-item" onclick="navigateTo('mood', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
        Настроение
      </button>
      <button class="nav-item" onclick="navigateTo('intimate', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
        Близость
      </button>
      <button class="nav-item" onclick="navigateTo('more', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
        Ещё
      </button>
    </nav>

  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Скрипты -->
<script src="js/supabase.js"></script>
<script src="js/router.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

<!-- Страницы -->
<script src="pages/dashboard.js"></script>
<script src="pages/planner.js"></script>
<script src="pages/mood.js"></script>
<script src="pages/intimate.js"></script>
<script src="pages/profile.js"></script>
<script src="pages/questions.js"></script>
<script src="pages/health.js"></script>
<script src="pages/gratitude.js"></script>
<script src="pages/finances.js"></script>
<script src="pages/conflict.js"></script>
<script src="pages/memories.js"></script>

</body>
</html>
